name: Deploy Next.js to cPanel

on:
  push:
    branches:
      - master

jobs:
  web-deploy:
    name: 🚀 Build and Deploy to cPanel
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout code
        uses: actions/checkout@v4

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build static site
        run: npm run build

      - name: 📂 Sync output to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          # Replace with the "Shared IP Address" from the cPanel home page (right-hand panel)
          server: YOUR.SHARED.IP.HERE
          port: 21
          protocol: ftps
          # The server's certificate is for a name, not an IP, so allow it
          security: loose
          username: deploy@machinemanuganda.com
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          local-dir: ./out/
          timeout: 60000
          log-level: verbose
          exclude: |
            **/.git*/**
            **/node_modules/**
            admin/db.php
            uploads/**
            api/**